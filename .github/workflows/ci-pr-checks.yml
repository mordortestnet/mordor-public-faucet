name: CI - PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-validation:
    name: Validate Pull Request
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check PR title
        uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.pull_request.title;
            
            // Check if title is descriptive
            if (title.length < 10) {
              core.setFailed('PR title is too short. Please provide a descriptive title (at least 10 characters)');
              return;
            }
            
            console.log('✅ PR title is descriptive');

      - name: Check for description
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || '';
            
            if (body.trim().length < 20) {
              core.warning('PR description is very short. Consider adding more details about your changes.');
            } else {
              console.log('✅ PR has a description');
            }

      - name: Check for linked issues
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || '';
            
            // Check for issue references like #123, fixes #123, closes #123
            const issuePattern = /(close[sd]?|fix(es|ed)?|resolve[sd]?)\s+#\d+|#\d+/i;
            
            if (issuePattern.test(body)) {
              console.log('✅ PR references an issue');
            } else {
              core.notice('Consider linking related issues using "Fixes #123" or "Closes #123"');
            }

      - name: Check file changes
        uses: actions/github-script@v7
        with:
          script: |
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number
            });
            
            console.log(`Files changed: ${files.length}`);
            
            // Check for changes to workflows
            const workflowChanges = files.filter(f => 
              f.filename.includes('.github/workflows/') || 
              f.filename.includes('catacomb/.github/workflows/')
            );
            
            if (workflowChanges.length > 0) {
              console.log('⚠️  This PR modifies GitHub Actions workflows');
              console.log('Please ensure:');
              console.log('1. Workflow syntax is valid');
              console.log('2. No secrets are exposed');
              console.log('3. Permissions are appropriate');
            }
            
            // Check for large PRs
            const totalChanges = files.reduce((sum, f) => sum + f.changes, 0);
            if (totalChanges > 500) {
              core.warning(`This PR has ${totalChanges} changes. Consider breaking it into smaller PRs for easier review.`);
            }

  auto-label:
    name: Auto Label PR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Label based on files changed
        uses: actions/github-script@v7
        with:
          script: |
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number
            });
            
            const labels = new Set();
            
            for (const file of files) {
              if (file.filename.includes('.github/workflows/') || 
                  file.filename.includes('catacomb/.github/workflows/')) {
                labels.add('workflows');
              }
              
              if (file.filename.endsWith('.md')) {
                labels.add('documentation');
              }
              
              if (file.filename.includes('catacomb/')) {
                labels.add('catacomb');
              }
              
              if (file.filename.includes('security') || 
                  file.filename.includes('SECURITY')) {
                labels.add('security');
              }
            }
            
            if (labels.size > 0) {
              try {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.payload.pull_request.number,
                  labels: Array.from(labels)
                });
                console.log(`Added labels: ${Array.from(labels).join(', ')}`);
              } catch (error) {
                console.log('Could not add labels (labels may not exist yet)');
              }
            }
